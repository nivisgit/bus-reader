<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus number reader</title>
<style>
  :root { --ink:#101820; --paper:#f2f4f7; --blue:#0b4fa8; --led:#ffc400; --board:#0c1118; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:18px/1.4 system-ui,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:4px 0 12px; }
  .cam { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:4/3; }
  .cam video { width:100%; height:100%; object-fit:cover; display:block; }
  .roi { position:absolute; left:15%; top:35%; width:70%; height:30%; border:3px solid var(--led); border-radius:8px; pointer-events:none; }
  .board { margin:12px 0; padding:14px; background:var(--board); border-radius:10px; text-align:center; }
  #result { color:var(--led); font:700 64px/1.1 "Arial Black",Impact,system-ui,sans-serif; letter-spacing:4px; min-height:70px; }
  #status { margin:8px 0 12px; min-height:26px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  button { min-height:58px; font:600 19px system-ui,sans-serif; border:0; border-radius:10px; background:var(--blue); color:#fff; }
  button:disabled { background:#9aa7b8; }
  button:focus-visible, input:focus-visible { outline:4px solid var(--led); outline-offset:2px; }
  label { display:block; margin:14px 0 6px; font-weight:600; }
  input { width:100%; min-height:50px; font-size:18px; padding:8px 12px; border:2px solid var(--ink); border-radius:8px; }
  small { display:block; margin-top:6px; color:#44525f; }
  details { margin-top:16px; }
  canvas { max-width:100%; background:#ddd; }
  pre { white-space:pre-wrap; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Bus number reader</h1>

  <div class="cam">
    <video id="v" playsinline muted></video>
    <div class="roi"></div>
  </div>

  <div class="board"><div id="result" aria-live="assertive">--</div></div>
  <div id="status" aria-live="polite">Tap Start camera, then point the route number into the yellow box.</div>

  <div class="row">
    <button id="start">Start camera</button>
    <button id="scan" disabled>Scan once</button>
  </div>
  <div class="row">
    <button id="auto" disabled>Auto-scan: off</button>
    <button id="again" disabled>Say it again</button>
  </div>

  <label for="routes">Routes at this stop (optional)</label>
  <input id="routes" placeholder="21G, 5E, M70" autocomplete="off">
  <small>With a list, a misread like 2lG is corrected to 21G. Leave it empty to accept any route number.</small>

  <details>
    <summary>What the reader sees</summary>
    <canvas id="dbg"></canvas>
    <pre id="raw"></pre>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const v = $('v'), statusEl = $('status'), result = $('result'), dbg = $('dbg'), raw = $('raw');
let worker = null, auto = false, busy = false;
let recent = [], last = { route: '', time: 0 }, lastSpoken = '';

const setStatus = t => { statusEl.textContent = t; };
function say(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-IN'; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

try { $('routes').value = localStorage.getItem('routes') || ''; } catch (e) {}
$('routes').addEventListener('change', () => {
  try { localStorage.setItem('routes', $('routes').value); } catch (e) {}
});
const routesList = () => $('routes').value.toUpperCase().split(/[\s,]+/).filter(Boolean);

function lev(a, b) {
  const m = [...Array(a.length + 1)].map((_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}

// Turn raw text into a route number, or '' if it does not look like one.
function pick(text) {
  const t = text.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!t) return '';
  const list = routesList();
  if (list.length) {
    let best = '', bd = 9;
    for (const r of list) { const d = lev(t, r); if (d < bd) { bd = d; best = r; } }
    return bd <= 1 ? best : '';
  }
  return /^[A-Z]?\d{1,3}[A-Z]?$/.test(t) ? t : '';
}

// Crop the yellow box, make it grayscale and high contrast, optionally inverted.
function crop(invert) {
  const vw = v.videoWidth, vh = v.videoHeight;
  const cw = Math.round(vw * 0.7), ch = Math.round(vh * 0.3);
  const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
  const sc = Math.max(1, 900 / cw);
  dbg.width = Math.round(cw * sc); dbg.height = Math.round(ch * sc);
  const c = dbg.getContext('2d');
  c.drawImage(v, sx, sy, cw, ch, 0, 0, dbg.width, dbg.height);
  const img = c.getImageData(0, 0, dbg.width, dbg.height), d = img.data;
  let lo = 255, hi = 0;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    d[i] = g; if (g < lo) lo = g; if (g > hi) hi = g;
  }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) {
    let g = (d[i] - lo) * 255 / span;
    if (invert) g = 255 - g;
    d[i] = d[i+1] = d[i+2] = g; d[i+3] = 255;
  }
  c.putImageData(img, 0, 0);
  return dbg.toDataURL('image/png');
}

async function start() {
  try {
    setStatus('Opening camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    v.srcObject = stream; await v.play();
    setStatus('Loading the text reader. The first time needs internet.');
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      tessedit_pageseg_mode: '7'
    });
    ['scan', 'auto', 'again'].forEach(i => { $(i).disabled = false; });
    $('start').disabled = true;
    setStatus('Ready. Point the route number into the yellow box.');
    say('Ready');
  } catch (e) {
    setStatus('Could not start: ' + (e.message || e) + '. Allow camera access and open this page over https.');
  }
}

// Read one frame. Tries normal and inverted, keeps the more confident result.
async function readFrame() {
  let best = { text: '', conf: 0 }, log = '';
  for (const inv of [false, true]) {
    const r = await worker.recognize(crop(inv));
    const p = pick(r.data.text), c = r.data.confidence;
    log += (inv ? 'inverted: ' : 'normal: ') + JSON.stringify(r.data.text.trim()) + ' (' + Math.round(c) + '%)\n';
    if (p && c > best.conf) best = { text: p, conf: c };
  }
  raw.textContent = log;
  return best;
}

function announce(route) {
  const now = Date.now();
  if (route === last.route && now - last.time < 20000) { setStatus('Still seeing bus ' + route + '.'); return; }
  last = { route, time: now };
  result.textContent = route;
  lastSpoken = 'Bus ' + route.replace(/([A-Z])/g, ' $1 ').replace(/\s+/g, ' ').trim();
  say(lastSpoken);
  setStatus('Heard: ' + lastSpoken);
  $('again').disabled = false;
}

// A route is announced only when 2 of the last 3 frames agree.
function consider(best) {
  recent.push(best.conf >= 40 ? best.text : '');
  if (recent.length > 3) recent.shift();
  const counts = {};
  recent.forEach(r => { if (r) counts[r] = (counts[r] || 0) + 1; });
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  if (top && counts[top] >= 2) { announce(top); recent = []; return true; }
  return false;
}

async function scanFrames(n) {
  if (busy || !worker) return;
  busy = true; setStatus('Reading...');
  let done = false;
  try {
    for (let i = 0; i < n && !done; i++) done = consider(await readFrame());
    if (!done) setStatus(auto ? 'Looking for a bus number...' : 'Not sure. Aim at the number and scan again.');
  } catch (e) { setStatus('Read error: ' + e.message); }
  busy = false;
}

async function loop() {
  while (auto) { await scanFrames(1); await new Promise(r => setTimeout(r, 700)); }
}

$('start').onclick = start;
$('scan').onclick = () => { recent = []; scanFrames(3); };
$('again').onclick = () => say(lastSpoken || 'Nothing heard yet');
$('auto').onclick = () => {
  auto = !auto;
  $('auto').textContent = 'Auto-scan: ' + (auto ? 'on' : 'off');
  if (auto) loop();
};
</script>
</body>
</html>
